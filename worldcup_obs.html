  if(!rows) rows = `<div style="color:var(--muted);font-family:'Bebas Neue',cursive;padding:1rem">No scores entered yet</div>`;
  cont.innerHTML = `<div style="${gridStyle}">${rows}</div>`;
}

// ══════════════════════════════════════
// EXPORT NAME ALIASES (set in index.html → SPECIAL_TEAMS, shared via localStorage 'wc_special')
// Only applied while the image pack is being captured — live OBS is untouched.
// ══════════════════════════════════════
let exportingPack = false;
function aliasForExport(name){
  let list=[];
  try{ list=JSON.parse(localStorage.getItem('wc_special')||'[]'); }catch(e){}
  const n=String(name||'').toLowerCase();
  if(!n) return name;
  const t=list.find(x=>x&&x.match&&n.includes(String(x.match).toLowerCase())&&x.displayName);
  return t?t.displayName:name;
}
const exportImgCache = {};   // path -> data URL (so html2canvas never sees a tainting file path)
let exportImgErrors = [];
async function prepareExportImages(){
  exportImgErrors = [];
  const imgs=(lastData&&lastData.playerImages)||{};
  const paths=[...new Set(Object.values(imgs).filter(v=>typeof v==='string'&&v&&!v.startsWith('data:')))];
  for(const path of paths){
    if(exportImgCache[path]) continue;
    try{
      const res=await fetch(path,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const blob=await res.blob();
      exportImgCache[path]=await new Promise((ok,bad)=>{
        const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=bad; fr.readAsDataURL(blob);
      });
    }catch(e){ exportImgErrors.push(path+' ('+e.message+')'); }
  }
}
function applyExportAliases(){
  if(!lastData) return;
  if(Array.isArray(lastData.players)) lastData.players=lastData.players.map(aliasForExport);
  const imgs=lastData.playerImages;
  if(imgs){
    const out={};
    Object.keys(imgs).forEach(k=>{ out[k]=exportImgCache[imgs[k]]||imgs[k]; });
    lastData.playerImages=out;
  }
}

// ══════════════════════════════════════
// IMAGE PACK EXPORT
// ══════════════════════════════════════
async function downloadImagePack(){
  try{ await _downloadImagePackInner(); }
  finally{
    // If anything threw mid-export, make sure live OBS sync and the UI come back
    if(exportingPack){ exportingPack=false; load(); }
    const ov=document.getElementById('export-overlay'); if(ov) ov.style.display='none';
    const b=document.getElementById('dl-btn'); if(b){ b.disabled=false; b.style.opacity='1'; }
  }
}
async function _downloadImagePackInner(){
  if(!lastData){ alert('No tournament data loaded yet.'); return; }

  const btn = document.getElementById('dl-btn');
  const overlay = document.getElementById('export-overlay');
  const progBar = document.getElementById('export-prog-bar');
  const progLabel = document.getElementById('export-prog-label');

  // Build list of screens to capture
  const screens = [];
  let sNum = 1;
  for(const r of allRounds){
    const n = ()=>String(sNum).padStart(2,'0');
    if(r.type==='draw'){
      const ri=allRounds.indexOf(r);
      screens.push({key:'draw', label:`${n()} - Group Draw`, setup:async()=>{
        obsRound=ri; render();
        await new Promise(res=>setTimeout(res,150));
        renderDrawFinal();
      }});
    } else if(r.type==='group'){
      const md = r.matches[0]?.roundIdx ?? 0;
      screens.push({key:`group-${md}`, label:`${n()} - Matchday ${md+1}`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='round-tables'){
      screens.push({key:`round-tables-${r.upToRound}`, label:`${n()} - Tables after Round ${(r.upToRound??0)+1}`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='group-tables'){
      screens.push({key:'group-tables', label:`${n()} - Group Tables`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='r16'){
      screens.push({key:'r16', label:`${n()} - Final 16`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='qf'){
      screens.push({key:'qf', label:`${n()} - Quarter Finals`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='sf'){
      screens.push({key:'sf', label:`${n()} - Semi Finals`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='final'){
      screens.push({key:'final', label:`${n()} - Final and 3rd Place`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='results'){
      screens.push({key:'results', label:`${n()} - Results`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='goals'){
      screens.push({key:'goals', label:`${n()} - Total Goals`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    }
    sNum++;
  }

  // Swap special-team names for the exported images only
  exportingPack = true;
  await prepareExportImages();
  applyExportAliases();

  // Show overlay, disable button
  overlay.style.display='flex';
  btn.disabled=true; btn.style.opacity='0.4';
  stopCycle();
  wheelCancel();   // settle any spinning wheel so it can't block or hijack screen rendering

  const zip = new JSZip();
  const captureEl = document.querySelector('.wrap');
  const savedRound = obsRound;
  let captured = 0, lastCaptureError = '';

  for(let i=0;i<screens.length;i++){
    const sc = screens[i];
    progLabel.textContent = `Capturing: ${sc.label}`;
    progBar.style.width = `${Math.round((i/screens.length)*100)}%`;

    // Set up the screen
    await sc.setup();
    // Allow DOM to paint
    await new Promise(r=>setTimeout(r,320));

    try{
      const canvas = await html2canvas(captureEl, {
        scale: 1.5,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#0d3410',
        logging: false,
        ignoreElements: el => el.id==='export-overlay'
      });
      const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
      if(!blob) throw new Error('Canvas produced no image');
      zip.file(`${sc.label}.png`, blob);
      captured++;
    }catch(e){
      lastCaptureError = (e&&e.message)||String(e);
      console.warn('Capture failed for', sc.label, e);
    }
  }

  progLabel.textContent = 'Building zip…';
  progBar.style.width = '95%';

  // Restore real names + original screen
  exportingPack = false;
  load();
  obsRound = savedRound;
  render();

  const zipBlob = await zip.generateAsync({type:'blob'}, meta=>{
    progBar.style.width = `${95 + meta.percent*0.05}%`;
  });

  // Download (only if something was actually captured)
  if(captured>0){
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = 'WorldCup_OBS_Screens.zip';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }

  // Clean up
  progBar.style.width='100%';
  progLabel.textContent = captured>0 ? `✅ Done! (${captured}/${screens.length} screens)` : '❌ Export failed';
  await new Promise(r=>setTimeout(r,800));
  overlay.style.display='none';
  btn.disabled=false; btn.style.opacity='1';
  if(captured<screens.length){
    alert(`Only ${captured} of ${screens.length} screens were captured.\n\n`+
      (lastCaptureError?`Last error: ${lastCaptureError}\n\n`:'')+
      (exportImgErrors.length?`These logo files could not be loaded:\n${exportImgErrors.join('\n')}\n\nCheck the file names match SPECIAL_TEAMS in index.html and that the files are in the same folder (and that you're opening the pages from GitHub Pages / a web server, not by double-clicking them).`:''));
  }
}

load();
setInterval(load,2000);
// react instantly to the manager (storage events fire across tabs of the same origin)
window.addEventListener('storage',e=>{ if(!e.key||e.key.indexOf('wc_')===0) load(); });
window.addEventListener('resize',()=>{ if(wheelActive()) wheelSize(); });
