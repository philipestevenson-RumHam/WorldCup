<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🏆 World Cup OBS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#0d2a0f; --bg2:#112e13;
  --gold:#f6c90e; --gold2:#d4a80a;
  --blue:#60a5fa; --text:#f0f7f0; --muted:#5a8a5e;
  --border:rgba(255,255,255,0.1);
  --win:#4ade80; --lose:#f87171; --draw:#fbbf24;
  --grad-gold:linear-gradient(135deg,#f6c90e,#d4880a);
  --ga:#60a5fa; --gb:#c084fc; --gc:#4ade80; --gd:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;
  background:linear-gradient(160deg,#0a2a0c 0%,#0d3410 40%,#0a2a0c 100%);
  color:var(--text);font-family:'Barlow Condensed',sans-serif;}

/* Pitch stripe pattern */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 60px,
      transparent 60px, transparent 120px
    );}
/* Pitch centre circle */
body::after{content:'';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(65vw,900px);height:min(65vw,900px);
  border:2px solid rgba(255,255,255,0.04);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,0.025) 0%,transparent 65%);
  pointer-events:none;z-index:0;}

.wrap{position:relative;z-index:1;width:100vw;height:100vh;display:flex;flex-direction:column;
  padding:clamp(5px,0.8vh,12px) clamp(6px,1vw,14px);gap:clamp(4px,0.6vh,8px);}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;gap:0.75rem;flex-shrink:0;
  background:rgba(6,22,7,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:10px;
  padding:clamp(4px,0.6vh,9px) clamp(10px,1.5vw,20px);
  position:relative;overflow:hidden;}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--grad-gold);}
.hdr-logo{display:flex;flex-direction:column;line-height:1;flex-shrink:0;}
.hdr-title{font-family:'Bebas Neue',cursive;font-size:clamp(1rem,2.2vw,1.9rem);
  letter-spacing:0.1em;background:var(--grad-gold);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;}
.hdr-sub{font-size:clamp(0.38rem,0.65vw,0.56rem);text-transform:uppercase;
  letter-spacing:0.3em;color:var(--muted);font-weight:700;}

/* Stage badge */
.stage-badge{font-family:'Bebas Neue',cursive;font-size:clamp(0.65rem,1.1vw,0.95rem);
  letter-spacing:0.1em;padding:0.18em 0.7em;border-radius:5px;flex-shrink:0;
  width:clamp(90px,10vw,140px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-group{background:rgba(59,158,255,0.12);color:var(--blue);border:1px solid rgba(59,158,255,0.25);}
.sb-qf{background:rgba(246,201,14,0.12);color:var(--gold);border:1px solid rgba(246,201,14,0.25);}
.sb-sf{background:rgba(168,85,247,0.12);color:#c084fc;border:1px solid rgba(168,85,247,0.25);}
.sb-final{background:rgba(246,201,14,0.18);color:var(--gold);border:1px solid rgba(246,201,14,0.4);
  box-shadow:0 0 12px rgba(246,201,14,0.12);}

/* Round nav */
.round-nav{display:flex;align-items:center;gap:0.5rem;
  width:clamp(160px,18vw,260px);justify-content:center;flex-shrink:0;}
.nav-btn{background:none;border:1px solid var(--border);color:var(--gold);
  border-radius:50%;
  width:clamp(22px,2.2vw,32px);height:clamp(22px,2.2vw,32px);
  flex-shrink:0;
  font-size:clamp(0.6rem,1vw,0.85rem);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:rgba(246,201,14,0.12);}
.nav-btn:disabled{opacity:0.2;cursor:default;}
.round-lbl{font-family:'Bebas Neue',cursive;font-size:clamp(0.75rem,1.4vw,1.2rem);
  color:var(--muted);letter-spacing:0.1em;
  width:clamp(80px,10vw,160px);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}

/* Cycle btn */
.play-btn{background:var(--grad-gold);border:none;color:#000;border-radius:6px;
  padding:clamp(3px,0.45vh,6px) clamp(8px,1.2vw,14px);
  font-family:'Bebas Neue',cursive;font-size:clamp(0.65rem,1.1vw,0.95rem);
  letter-spacing:0.08em;cursor:pointer;transition:opacity 0.15s;
  flex-shrink:0;font-weight:700;
  width:clamp(68px,7.5vw,110px);text-align:center;white-space:nowrap;}
.play-btn:hover{opacity:0.85;}
.cycle-ind{font-family:'Bebas Neue',cursive;font-size:clamp(0.6rem,1vw,0.85rem);
  color:var(--gold);letter-spacing:0.1em;display:none;
  width:clamp(55px,6vw,90px);text-align:center;flex-shrink:0;}

/* Speed */
.speed-wrap{display:flex;align-items:center;gap:clamp(3px,0.5vw,8px);
  flex-shrink:0;width:clamp(120px,14vw,200px);}
.speed-lbl{font-size:clamp(0.45rem,0.72vw,0.62rem);color:var(--muted);
  text-transform:uppercase;letter-spacing:0.1em;white-space:nowrap;font-weight:700;}
.speed-val{font-family:'Bebas Neue',cursive;font-size:clamp(0.65rem,1.1vw,0.95rem);
  color:var(--gold);width:2.8em;text-align:right;white-space:nowrap;flex-shrink:0;}
input[type=range].speed-slider{-webkit-appearance:none;appearance:none;
  width:clamp(55px,7vw,110px);height:4px;
  background:rgba(246,201,14,0.18);border-radius:99px;outline:none;cursor:pointer;}
input[type=range].speed-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:13px;height:13px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 5px rgba(246,201,14,0.4);cursor:pointer;}
input[type=range].speed-slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
  border:none;background:var(--gold);cursor:pointer;}

/* Live dot */
.live-badge{display:flex;align-items:center;gap:0.35rem;
  font-size:clamp(0.45rem,0.78vw,0.68rem);color:var(--muted);
  text-transform:uppercase;letter-spacing:0.1em;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--win);
  box-shadow:0 0 6px var(--win);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── GRID ── */
.grid{flex:1;display:grid;gap:clamp(4px,0.7vh,10px);min-height:0;}

/* ── WAITING ── */
#waiting-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:1rem;padding:2rem;text-align:center;}
.wait-title{font-family:'Bebas Neue',cursive;font-size:clamp(1.2rem,2.5vw,2rem);
  letter-spacing:0.1em;color:var(--muted);}
.wait-box{background:rgba(4,16,5,0.7);border:1px solid var(--border);border-radius:8px;
  padding:0.75rem 1.25rem;font-size:0.75rem;color:var(--muted);
  font-family:monospace;max-width:580px;width:100%;text-align:left;line-height:1.8;}

/* ── COMPACT CARD ── */
.card{background:rgba(6,22,7,0.94);border:1px solid rgba(255,255,255,0.1);
  border-radius:clamp(6px,0.9vw,12px);overflow:hidden;
  display:flex;flex-direction:column;min-height:0;position:relative;}
.card-hdr{background:rgba(246,201,14,0.09);border-bottom:1px solid rgba(255,255,255,0.08);
  padding:clamp(3px,0.5vh,7px) clamp(7px,1.1vw,14px);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.card-hdr-lbl{font-family:'Bebas Neue',cursive;font-size:clamp(0.65rem,1.2vw,1rem);
  letter-spacing:0.1em;color:var(--gold);display:flex;align-items:center;gap:0.4em;}
.card-body{flex:1;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:stretch;min-height:0;
  padding:clamp(4px,0.8vh,10px) clamp(5px,0.9vw,12px);}
.team{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,0.4vh,5px);min-width:0;}
.team-crest{flex-shrink:0;border-radius:clamp(4px,0.7vw,9px);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);}
.team-crest img{width:100%;height:100%;object-fit:cover;}
.team-crest .ini{font-family:'Bebas Neue',cursive;letter-spacing:0.05em;}
.team-name{font-family:'Bebas Neue',cursive;font-size:clamp(0.5rem,1vw,0.9rem);
  text-align:center;line-height:1.15;word-break:break-word;width:100%;letter-spacing:0.04em;padding-bottom:0.15em;}
.hn{border-bottom:3px solid #60a5fa;}
.an{border-bottom:3px solid var(--gold);}
.score-col{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0.15em;flex-shrink:0;padding:0 clamp(2px,0.35vw,5px);}
.score-num{font-family:'Bebas Neue',cursive;line-height:1;white-space:nowrap;
  font-size:clamp(1.6rem,3.5vw,4.8rem);}
.score-sep{color:var(--muted);}
.score-pending{font-family:'Bebas Neue',cursive;color:var(--muted);
  font-size:clamp(0.9rem,2vw,2.6rem);letter-spacing:0.1em;}
.result-bar{flex-shrink:0;text-align:center;font-family:'Bebas Neue',cursive;
  font-size:clamp(0.6rem,1.2vw,1rem);letter-spacing:0.08em;
  padding:clamp(2px,0.35vh,5px);border-top:1px solid rgba(255,255,255,0.08);}
.rb-win{color:var(--win);background:rgba(74,222,128,0.1);}
.rb-draw{color:var(--draw);background:rgba(251,191,36,0.08);}
.rb-pending{color:var(--muted);}
.confetti-canvas{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:3;border-radius:inherit;}
.trophy-ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(2rem,6vw,8rem);opacity:0.06;pointer-events:none;z-index:0;line-height:1;}

/* Group label badge */
.grp-badge{font-family:'Bebas Neue',cursive;font-size:clamp(0.5rem,0.85vw,0.72rem);
  letter-spacing:0.12em;padding:0.1em 0.45em;border-radius:3px;flex-shrink:0;}
.gb-a{background:rgba(59,158,255,0.15);color:var(--ga);}
.gb-b{background:rgba(168,85,247,0.15);color:var(--gb);}
.gb-c{background:rgba(34,197,94,0.15);color:var(--gc);}
.gb-d{background:rgba(245,158,11,0.15);color:var(--gd);}
.gb-qf{background:rgba(246,201,14,0.15);color:var(--gold);}
.gb-sf{background:rgba(168,85,247,0.15);color:#c084fc;}
.gb-fin{background:rgba(246,201,14,0.2);color:var(--gold);}
.gb-3rd{background:rgba(205,127,50,0.15);color:#cd7f32;}

/* ── SINGLE / FULLSCREEN CARD ── */
.card-single{display:flex;flex-direction:column;
  background:rgba(4,18,5,0.97);border:1px solid rgba(255,255,255,0.1);
  border-radius:clamp(7px,1vw,14px);overflow:hidden;height:100%;position:relative;}
.card-single-hdr{flex-shrink:0;
  background:rgba(246,201,14,0.09);border-bottom:1px solid rgba(255,255,255,0.08);
  padding:clamp(4px,0.7vh,10px) clamp(12px,2vw,28px);
  display:flex;align-items:center;justify-content:space-between;}
.card-single-hdr-lbl{font-family:'Bebas Neue',cursive;
  font-size:clamp(0.9rem,2vw,1.8rem);letter-spacing:0.12em;color:var(--gold);}
.card-single-body{flex:1;min-height:0;
  display:grid;grid-template-columns:1fr clamp(130px,20vw,280px) 1fr;}
.csteam{display:flex;flex-direction:column;align-items:center;
  padding:clamp(6px,1.1vh,14px) clamp(6px,1vw,14px);
  gap:clamp(4px,0.7vh,9px);position:relative;overflow:hidden;}
.csteam-bg{position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(6px) brightness(0.22) saturate(0.5);transform:scale(1.08);}
.csteam-content{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;gap:clamp(4px,0.7vh,9px);width:100%;flex:1;min-height:0;}
.csteam-label{font-size:clamp(0.45rem,0.85vw,0.75rem);text-transform:uppercase;
  letter-spacing:0.12em;color:rgba(255,255,255,0.45);font-weight:700;flex-shrink:0;}
.csteam-crest{flex:1;min-height:0;width:80%;max-height:42vh;
  display:flex;align-items:center;justify-content:center;}
.csteam-crest img{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 4px 22px rgba(0,0,0,0.55));}
.csteam-crest-ini{font-family:'Bebas Neue',cursive;
  font-size:clamp(2.5rem,9vw,9rem);letter-spacing:0.03em;line-height:1;}
.csteam-name{flex-shrink:0;font-family:'Bebas Neue',cursive;
  font-size:clamp(0.9rem,2.5vw,2.8rem);letter-spacing:0.06em;
  text-align:center;line-height:1.1;word-break:break-word;width:100%;
  padding:0.1em 0 0.15em;}
.cn-home{border-bottom:3px solid #3b82f6;}
.cn-away{border-bottom:3px solid var(--gold);}
.csteam-pts{flex-shrink:0;font-family:'Bebas Neue',cursive;
  font-size:clamp(0.75rem,1.6vw,1.5rem);letter-spacing:0.1em;
  padding:0.15em 0.6em;border-radius:6px;}
.cp-w{color:var(--win);background:rgba(34,197,94,0.18);}
.cp-d{color:var(--draw);background:rgba(245,158,11,0.14);}
.cp-l{color:var(--lose);background:rgba(239,68,68,0.12);}
.cp-u{color:var(--muted);background:rgba(255,255,255,0.05);}
.csscore{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(4px,0.7vh,9px);padding:clamp(6px,1vh,12px) clamp(4px,0.5vw,7px);
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  background:rgba(4,16,5,0.6);}
.csscore-num{font-family:'Bebas Neue',cursive;line-height:1;
  font-size:clamp(2.2rem,6.5vw,7.5rem);white-space:nowrap;}
.csscore-sep{color:var(--muted);}
.csscore-vs{font-family:'Bebas Neue',cursive;color:var(--muted);
  font-size:clamp(0.85rem,1.8vw,1.8rem);letter-spacing:0.2em;}
.csscore-pending{font-family:'Bebas Neue',cursive;color:var(--muted);
  font-size:clamp(1rem,3vw,3.5rem);letter-spacing:0.1em;}
.card-single-result{flex-shrink:0;text-align:center;font-family:'Bebas Neue',cursive;
  font-size:clamp(0.7rem,1.6vw,1.5rem);letter-spacing:0.1em;
  padding:clamp(3px,0.55vh,9px);border-top:1px solid var(--border);}
.csr-win{color:var(--win);background:rgba(34,197,94,0.1);}
.csr-draw{color:var(--draw);background:rgba(245,158,11,0.07);}
.csr-pending{color:var(--muted);}

/* ── GROUP STANDINGS STRIP ── */
.strip{flex-shrink:0;background:rgba(6,22,7,0.95);border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;padding:clamp(3px,0.4vh,6px) clamp(8px,1.2vw,18px);
  display:flex;align-items:center;gap:clamp(6px,1vw,16px);overflow:hidden;}
.strip-lbl{font-family:'Bebas Neue',cursive;font-size:clamp(0.5rem,0.85vw,0.74rem);
  color:var(--muted);letter-spacing:0.1em;flex-shrink:0;white-space:nowrap;}
.strip-groups{display:flex;gap:clamp(8px,1.5vw,24px);align-items:center;
  overflow:hidden;flex:1;flex-wrap:nowrap;}
.strip-group{display:flex;align-items:center;gap:clamp(3px,0.5vw,8px);flex-shrink:0;}
.strip-group-lbl{font-family:'Bebas Neue',cursive;font-size:clamp(0.5rem,0.82vw,0.72rem);
  letter-spacing:0.08em;padding:0.1em 0.35em;border-radius:3px;white-space:nowrap;}
.strip-item{display:flex;align-items:center;gap:clamp(2px,0.35vw,5px);
  font-size:clamp(0.44rem,0.78vw,0.7rem);font-weight:600;white-space:nowrap;flex-shrink:0;}
.strip-rank{font-family:'Bebas Neue',cursive;font-size:clamp(0.48rem,0.8vw,0.72rem);
  width:1.1em;text-align:center;}
.sr1{color:#ffd700;}.sr2{color:#9ca3af;}.sr3{color:rgba(148,163,184,0.5);}
.strip-mini-crest{width:clamp(12px,1.3vw,18px);height:clamp(12px,1.3vw,18px);
  border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);}
.strip-mini-crest img{width:100%;height:100%;object-fit:cover;}
.strip-pts{font-family:'Bebas Neue',cursive;font-size:clamp(0.55rem,0.9vw,0.82rem);
  color:var(--gold);background:rgba(246,201,14,0.1);border-radius:3px;padding:0 3px;}
.strip-sep{color:var(--border);font-size:0.75rem;}
.strip-winner{background:rgba(246,201,14,0.12);border:1px solid rgba(246,201,14,0.3);
  border-radius:3px;padding:0 4px;color:var(--gold);}

/* ── DRAW SCREEN ── */
.draw-group-col{
  background:rgba(6,22,7,0.92);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0;
}
.draw-group-hdr{
  padding:clamp(3px,0.5vh,7px) clamp(6px,1vw,12px);
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border);flex-shrink:0;
  font-family:'Bebas Neue',cursive;font-size:clamp(0.9rem,1.6vw,1.5rem);letter-spacing:0.12em;
}
.draw-slot{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(2px,0.3vh,5px);padding:clamp(2px,0.4vh,6px) clamp(4px,0.6vw,8px);
  border-bottom:1px solid var(--border);position:relative;overflow:hidden;
  min-height:0;
}
.draw-slot:last-child{border-bottom:none;}
.draw-slot-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(5px) brightness(0.18) saturate(0.4);transform:scale(1.08);z-index:0;
  transition:opacity 0.3s;
}
.draw-slot-content{
  position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;gap:clamp(2px,0.3vh,4px);width:100%;min-height:0;
}
.draw-slot-crest{
  width:clamp(20px,3.5vh,56px);height:clamp(20px,3.5vh,56px);
  border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:transform 0.2s;
}
.draw-slot-crest img{width:100%;height:100%;object-fit:cover;}
.draw-slot-name{
  font-family:'Bebas Neue',cursive;font-size:clamp(0.55rem,1.1vw,1rem);
  letter-spacing:0.06em;text-align:center;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;
}
.draw-slot.spinning .draw-slot-name{
  color:var(--muted);animation:spinText 0.08s linear infinite;
}
.draw-slot.revealed .draw-slot-name{color:var(--text);}
@keyframes spinText{0%{opacity:1}50%{opacity:0.2}100%{opacity:1}}
.draw-slot.spinning .draw-slot-crest{filter:brightness(0.3) blur(1px);}
.draw-slot.revealed .draw-slot-crest{filter:none;animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{0%{transform:scale(0.6)}100%{transform:scale(1)}}
.draw-slot.pending .draw-slot-name{color:var(--muted);}
.draw-slot.pending .draw-slot-crest{filter:brightness(0.2);}
/* ── RESULTS SCREEN ── */
.results-wrap{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  width:100%;height:100%;gap:clamp(6px,1vw,14px);min-height:0;
}
.results-podium{
  display:flex;flex-direction:column;gap:clamp(4px,0.7vh,10px);

<script>
// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let obsRound    = 0;
let lastData    = null;
let allRounds   = [];
let rafIds      = {};
let cycleActive    = false;
let cycleMatchIdx  = 0;
let cycleTimer     = null;
let cycleDelay     = 3000;
let userNavigated  = false;
let drawPlayed     = false;
let lastDrawTrigger = localStorage.getItem('wc_obs_draw_trigger'); // seed so existing value never auto-fires

const SPEED_MAP = [10000,7000,5000,4000,3000,2000,1500,1000,750,500];

function onSpeedChange(v){
  const idx=parseInt(v)-1;
  cycleDelay=SPEED_MAP[idx];
  const s=cycleDelay>=1000?(cycleDelay/1000).toFixed(cycleDelay<2000?1:0)+'s':cycleDelay+'ms';
  document.getElementById('speed-val').textContent=s;
  if(cycleActive){clearInterval(cycleTimer);cycleTimer=setInterval(advanceCycle,cycleDelay);}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ══════════════════════════════════════
// IMAGE LOOKUP
// ══════════════════════════════════════
function getImg(idx){
  if(idx===null||idx===undefined) return null;
  if(!lastData||!lastData.playerImages) return null;
  const imgs=lastData.playerImages;
  if(imgs[idx]) return imgs[idx];
  if(imgs[String(idx)]) return imgs[String(idx)];
  return null;
}

function miniCrest(idx){
  if(idx===null||idx===undefined) return `<div class="strip-mini-crest" style="background:var(--muted)">?</div>`;
  const src=getImg(idx);
  const name=lastData&&lastData.players?lastData.players[idx]||'':'';
  const hue=(name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
  const ini=(name||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?';
  if(src) return `<div class="strip-mini-crest"><img src="${src}" alt=""></div>`;
  return `<div class="strip-mini-crest" style="background:hsl(${hue},40%,14%);border-color:hsl(${hue},40%,25%);font-family:'Bebas Neue',cursive;font-size:0.55rem;color:hsl(${hue},55%,60%)">${ini}</div>`;
}

function crestHtml(idx,size){
  if(idx===null||idx===undefined){
    return `<div class="team-crest" style="width:${size}px;height:${size}px;background:rgba(255,255,255,0.05);border-color:var(--border)">
      <span class="ini" style="color:var(--muted);font-size:${Math.round(size*0.28)}px">TBD</span></div>`;
  }
  const src=getImg(idx);
  const name=lastData&&lastData.players?lastData.players[idx]||`Team ${idx+1}`:'?';
  const hue=(name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
  const ini=(name||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
  if(src) return `<div class="team-crest" style="width:${size}px;height:${size}px"><img src="${src}" alt=""></div>`;
  return `<div class="team-crest" style="width:${size}px;height:${size}px;background:hsl(${hue},40%,14%);border-color:hsl(${hue},40%,25%)">
    <span class="ini" style="color:hsl(${hue},55%,60%);font-size:${Math.round(size*0.28)}px">${ini}</span></div>`;
}

function pName(idx){
  if(idx===null||idx===undefined) return 'TBD';
  return lastData&&lastData.players?lastData.players[idx]||`Team ${idx+1}`:`Team ${idx+1}`;
}

// ══════════════════════════════════════
// GROUP STANDINGS CALC
// ══════════════════════════════════════
function calcGroupStandings(g, data, upToRound){
  const {groups, groupSchedule, groupScores, numPlayers} = data;
  const perGroup = numPlayers/4;
  const totalR   = perGroup-1;
  const maxRound = (upToRound===undefined||upToRound===null) ? totalR-1 : Math.min(upToRound, totalR-1);
  const teamIdxs = groups[g]||[];
  const stats={};
  teamIdxs.forEach(i=>stats[i]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,idx:i});
  for(let r=0;r<=maxRound;r++){
    const rm=(groupSchedule||[]).filter(m=>m.round===r&&m.group===g);
    const rKey=String(r);
    const roundScores=groupScores&&(groupScores[rKey]||groupScores[r]);
    rm.forEach(match=>{
      const origIdx=(groupSchedule||[]).filter(m=>m.round===r).indexOf(match);
      const s=(roundScores&&(roundScores[origIdx]||roundScores[String(origIdx)]))||{};
      const hS=s.home===''||s.home===undefined?null:parseInt(s.home);
      const aS=s.away===''||s.away===undefined?null:parseInt(s.away);
      if(hS===null||aS===null) return;
      stats[match.home].p++;stats[match.away].p++;
      stats[match.home].gf+=hS;stats[match.home].ga+=aS;
      stats[match.away].gf+=aS;stats[match.away].ga+=hS;
      if(hS>aS){stats[match.home].w++;stats[match.home].pts+=3;stats[match.away].l++;}
      else if(hS<aS){stats[match.away].w++;stats[match.away].pts+=3;stats[match.home].l++;}
      else{stats[match.home].d++;stats[match.home].pts++;stats[match.away].d++;stats[match.away].pts++;}
    });
  }
  const tb = (data&&data.tiebreakers)||{};
  return Object.values(stats).map(s=>({...s, gd:s.gf-s.ga})).sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.gd!==a.gd)  return b.gd-a.gd;
    if(b.gf!==a.gf)  return b.gf-a.gf;
    const key=`group-${g}-${Math.min(a.idx,b.idx)}-${Math.max(a.idx,b.idx)}`;
    if(tb[key]!==undefined){
      if(tb[key]===a.idx) return -1;
      if(tb[key]===b.idx) return 1;
    }
    return pName(a.idx).localeCompare(pName(b.idx));
  });
}

// ══════════════════════════════════════
// BUILD ROUND LIST
// ══════════════════════════════════════
// Rounds = group matchdays + QF round + Final round
// A knockout round is shown as soon as the tournament has been generated,
// even if the team slots are still null (TBD) — the card renders "TBD" gracefully.
function buildAllRounds(data){
  const {numPlayers, groupSchedule, groupScores, knockout, knockoutScores} = data;
  const perGroup = numPlayers/4;
  const totalR   = perGroup-1;
  const rounds   = [];
  const ks       = knockoutScores||{};
  const ko       = knockout||{};

  // Round 0 — Group Draw screen (always first)
  rounds.push({type:'draw', label:'Group Draw'});

  // Group stage rounds — each followed by a "tables so far" screen
  for(let r=0;r<totalR;r++){
    const ms=(groupSchedule||[]).filter(m=>m.round===r);
    const matches=ms.map(m=>{
      const origIdx=(groupSchedule||[]).filter(mm=>mm.round===r).indexOf(m);
      const rKey=String(r);
      const roundScores=groupScores&&(groupScores[rKey]||groupScores[r]);
      const s=(roundScores&&(roundScores[origIdx]||roundScores[String(origIdx)]))||{home:'',away:''};
      return {
        home:m.home, away:m.away, group:m.group,
        hScore:(s.home??''), aScore:(s.away??''),
        roundIdx:r, matchIdx:origIdx,
        type:'group',
        label:`Group ${['A','B','C','D'][m.group]||'?'} Match`
      };
    });
    rounds.push({type:'group', label:`Matchday ${r+1}`, matches});
    rounds.push({type:'round-tables', label:`Tables after Round ${r+1}`, upToRound:r});
  }

  // Group Tables — shows after last matchday, before QF (all rounds = same as last round-tables)
  rounds.push({type:'group-tables', label:'Group Tables'});

  // Quarter-Finals — 4 matches, always shown once tournament is generated
  const qfDefs = [
    {idx:0, key:'qf0', label:'QF1 — A1 vs B2'},
    {idx:1, key:'qf1', label:'QF2 — B1 vs A2'},
    {idx:2, key:'qf2', label:'QF3 — C1 vs D2'},
    {idx:3, key:'qf3', label:'QF4 — D1 vs C2'},
  ];
  const qfMatches = qfDefs.map(({idx,key,label})=>{
    const m=(ko.qf&&ko.qf[idx])||{home:null,away:null};
    const s=ks[key]||{};
    return {
      home:m.home, away:m.away,
      hScore:(s.home??''), aScore:(s.away??''),
      key, type:'qf', label
    };
  });
  rounds.push({type:'qf', label:'Quarter-Finals', matches:qfMatches});

  // Semi-Finals — 2 matches
  const sfDefs = [
    {idx:0, key:'sf0', label:'SF1 — QF1 Winner vs QF2 Winner'},
    {idx:1, key:'sf1', label:'SF2 — QF3 Winner vs QF4 Winner'},
  ];
  const sfMatches = sfDefs.map(({idx,key,label})=>{
    const m=(ko.sf&&ko.sf[idx])||{home:null,away:null};
    const s=ks[key]||{};
    return {
      home:m.home, away:m.away,
      hScore:(s.home??''), aScore:(s.away??''),
      key, type:'sf', label
    };
  });
  rounds.push({type:'sf', label:'Semi-Finals', matches:sfMatches});

  const fin  = ko.final ||{home:null,away:null};
  const trd  = ko.third ||{home:null,away:null};
  const finMatches = [
    {
      home:fin.home, away:fin.away,
      hScore:((ks.final||{}).home??''), aScore:((ks.final||{}).away??''),
      key:'final', type:'final', label:'🏆 Final'
    },
    {
      home:trd.home, away:trd.away,
      hScore:((ks.third||{}).home??''), aScore:((ks.third||{}).away??''),
      key:'third', type:'third', label:'🥉 3rd Place'
    }
  ];
  rounds.push({type:'final', label:'Final & 3rd Place', matches:finMatches});

  // Results screen
  rounds.push({type:'results', label:'🏆 Results'});

  // Total Goals leaderboard — always last
  rounds.push({type:'goals', label:'⚽ Total Goals'});

  return rounds;
}

// ══════════════════════════════════════
// CONFETTI
// ══════════════════════════════════════
function launchConfetti(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||400,H=canvas.offsetHeight||400;
  canvas.width=W;canvas.height=H;
  const cols=['#f6c90e','#3b9eff','#22c55e','#f472b6','#ffffff','#a3e635'];
  const pieces=Array.from({length:70},()=>({
    x:Math.random()*W,y:Math.random()*H-H,
    vx:(Math.random()-0.5)*2.5,vy:Math.random()*3.5+1.2,
    c:cols[Math.floor(Math.random()*cols.length)],
    w:Math.random()*9+3,h:Math.random()*5+2,r:Math.random()*360
  }));
  if(rafIds[canvasId]) cancelAnimationFrame(rafIds[canvasId]);
  function tick(){
    ctx.clearRect(0,0,W,H);
    pieces.forEach(p=>{
      p.y+=p.vy;p.x+=p.vx;p.r+=2.5;
      if(p.y>H){p.y=-12;p.x=Math.random()*W;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    rafIds[canvasId]=requestAnimationFrame(tick);
  }
  rafIds[canvasId]=requestAnimationFrame(tick);
}
function stopAllConfetti(){Object.values(rafIds).forEach(id=>cancelAnimationFrame(id));rafIds={};}

// ══════════════════════════════════════
// CARD HTML
// ══════════════════════════════════════
function matchBadgeHtml(m){
  if(m.type==='group'){
    const labels=['A','B','C','D'];const cls=['gb-a','gb-b','gb-c','gb-d'];
    return `<span class="grp-badge ${cls[m.group]||''}">Group ${labels[m.group]||'?'}</span>`;
  }
  if(m.type==='qf')  return `<span class="grp-badge gb-qf">Quarter-Final</span>`;
  if(m.type==='sf')  return `<span class="grp-badge gb-sf">Semi-Final</span>`;
  if(m.type==='final') return `<span class="grp-badge gb-fin">🏆 Final</span>`;
  if(m.type==='third') return `<span class="grp-badge gb-3rd">🥉 3rd Place</span>`;
  return '';
}

function compactCardHtml(m, mi, crestPx, large){
  const hIdx=m.home, aIdx=m.away;
  const hS=(m.hScore===''||m.hScore===null||m.hScore===undefined)?null:parseInt(m.hScore);
  const aS=(m.aScore===''||m.aScore===null||m.aScore===undefined)?null:parseInt(m.aScore);
  const done=hS!==null&&aS!==null&&hIdx!==null&&aIdx!==null;
  const hWin=done&&hS>aS, aWin=done&&aS>hS, draw=done&&hS===aS;
  const hName=hIdx!==null?pName(hIdx):'TBD';
  const aName=aIdx!==null?pName(aIdx):'TBD';
  const confId=`conf-${mi}`;

  // Score display
  let scoreHtml, resText='Upcoming', resCls='rb-pending';
  let hPts='– PTS', aPts='– PTS', hPtsCls='color:var(--muted)', aPtsCls='color:var(--muted)';
  if(done){
    const hCol=hWin?'var(--win)':aWin?'var(--lose)':'var(--draw)';
    const aCol=aWin?'var(--win)':hWin?'var(--lose)':'var(--draw)';
    if(large){
      scoreHtml=`<div style="font-family:'Bebas Neue',cursive;font-size:clamp(2.5rem,6vw,7rem);line-height:1;white-space:nowrap">
        <span style="color:${hCol}">${hS}</span><span style="color:var(--muted)"> – </span><span style="color:${aCol}">${aS}</span></div>`;
    } else {
      scoreHtml=`<div class="score-num"><span style="color:${hCol}">${hS}</span><span class="score-sep">–</span><span style="color:${aCol}">${aS}</span></div>`;
    }
    if(hWin){resText=`🏆 ${esc(hName)} Wins`;resCls='rb-win';hPts='+3 PTS';hPtsCls='color:var(--win)';aPts='0 PTS';aPtsCls='color:var(--lose)';}
    else if(aWin){resText=`🏆 ${esc(aName)} Wins`;resCls='rb-win';aPts='+3 PTS';aPtsCls='color:var(--win)';hPts='0 PTS';hPtsCls='color:var(--lose)';}
    else{resText='Draw';resCls='rb-draw';hPts='+1 PT';hPtsCls='color:var(--draw)';aPts='+1 PT';aPtsCls='color:var(--draw)';}
  } else {
    scoreHtml=large
      ? `<div style="font-family:'Bebas Neue',cursive;font-size:clamp(1.5rem,4vw,4rem);color:var(--muted);letter-spacing:0.15em">VS</div>`
      : `<div class="score-pending">– vs –</div>`;
  }

  // Crests
  const hSrc=hIdx!==null?getImg(hIdx):null;
  const aSrc=aIdx!==null?getImg(aIdx):null;
  const hHue=((hName).split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
  const aHue=((aName).split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
  const hIni=(hName||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
  const aIni=(aName||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';

  if(large){
    // ── LARGE KO CARD ─────────────────────────────────────────────
    const hBg=hSrc?`style="background-image:url('${hSrc}')"`:'' ;
    const aBg=aSrc?`style="background-image:url('${aSrc}')"`:'' ;
    const hCrestInner=hSrc
      ?`<img src="${hSrc}" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 22px rgba(0,0,0,0.55))" alt="">`
      :`<span style="font-family:'Bebas Neue',cursive;font-size:clamp(2.5rem,7vw,7rem);color:hsl(${hHue},60%,62%)">${hIni}</span>`;
    const aCrestInner=aSrc
      ?`<img src="${aSrc}" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 22px rgba(0,0,0,0.55))" alt="">`
      :`<span style="font-family:'Bebas Neue',cursive;font-size:clamp(2.5rem,7vw,7rem);color:hsl(${aHue},60%,62%)">${aIni}</span>`;
    const nameSz='font-size:clamp(1rem,2.8vw,3rem)';
    const ptsSz='font-size:clamp(0.75rem,1.5vw,1.4rem)';

    return `<div class="card" style="flex-direction:row">
      <div class="card-hdr" style="position:absolute;top:0;left:0;right:0;z-index:5;background:rgba(6,22,7,0.92)">
        <span class="card-hdr-lbl">⚽ ${esc(m.label||`Match ${mi+1}`)}</span>
        <div style="display:flex;align-items:center;gap:0.4rem">
          ${matchBadgeHtml(m)}
          <span style="font-family:'Bebas Neue',cursive;font-size:clamp(0.55rem,1vw,0.85rem);color:${done?'var(--win)':'var(--muted)'}">${done?'✅ FT':'⏳'}</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr clamp(100px,16vw,200px) 1fr;width:100%;height:100%;padding-top:clamp(28px,3.5vh,44px)">
        <div style="position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,0.7vh,10px);padding:clamp(6px,1vh,14px) clamp(6px,1vw,14px)">
          <div style="position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(6px) brightness(0.22) saturate(0.5);transform:scale(1.08);z-index:0" ${hBg}></div>
          ${hWin?`<canvas class="confetti-canvas" id="${confId}-h" style="z-index:4"></canvas><div class="trophy-ghost">🏆</div>`:''}
          <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,0.7vh,10px);width:100%;flex:1;min-height:0">
            <div style="font-size:clamp(0.45rem,0.85vw,0.75rem);text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.45);font-weight:700">🏠 Home</div>
            <div style="flex:1;min-height:0;width:80%;display:flex;align-items:center;justify-content:center">${hCrestInner}</div>
            <div style="font-family:'Bebas Neue',cursive;${nameSz};letter-spacing:0.06em;text-align:center;border-bottom:3px solid #3b82f6;padding-bottom:0.15em;${hWin?'color:var(--win);text-shadow:0 0 20px rgba(34,197,94,0.4)':''}">${esc(hName)}</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.4em;border-left:1px solid var(--border);border-right:1px solid var(--border);background:rgba(4,16,5,0.7);padding:0.5rem">
          ${scoreHtml}
        </div>
        <div style="position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,0.7vh,10px);padding:clamp(6px,1vh,14px) clamp(6px,1vw,14px)">
          <div style="position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(6px) brightness(0.22) saturate(0.5);transform:scale(1.08);z-index:0" ${aBg}></div>
          ${aWin?`<canvas class="confetti-canvas" id="${confId}-a" style="z-index:4"></canvas><div class="trophy-ghost">🏆</div>`:''}
          <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,0.7vh,10px);width:100%;flex:1;min-height:0">
            <div style="font-size:clamp(0.45rem,0.85vw,0.75rem);text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.45);font-weight:700">✈️ Away</div>
            <div style="flex:1;min-height:0;width:80%;display:flex;align-items:center;justify-content:center">${aCrestInner}</div>
            <div style="font-family:'Bebas Neue',cursive;${nameSz};letter-spacing:0.06em;text-align:center;border-bottom:3px solid var(--gold);padding-bottom:0.15em;${aWin?'color:var(--win);text-shadow:0 0 20px rgba(34,197,94,0.4)':''}">${esc(aName)}</div>
          </div>
        </div>
      </div>
      <div class="result-bar ${resCls}" style="position:absolute;bottom:0;left:0;right:0;font-size:clamp(0.8rem,1.6vw,1.4rem)">${resText}</div>
    </div>`;
  }

  // ── COMPACT CARD (group stage) ─────────────────────────────────
  const hCrest=hSrc?`<div class="team-crest" style="width:${crestPx}px;height:${crestPx}px"><img src="${hSrc}"></div>`:
    `<div class="team-crest" style="width:${crestPx}px;height:${crestPx}px;background:hsl(${hHue},40%,14%);border-color:hsl(${hHue},40%,25%)"><span class="ini" style="color:hsl(${hHue},55%,60%);font-size:${Math.round(crestPx*0.28)}px">${hIni}</span></div>`;
  const aCrest=aSrc?`<div class="team-crest" style="width:${crestPx}px;height:${crestPx}px"><img src="${aSrc}"></div>`:
    `<div class="team-crest" style="width:${crestPx}px;height:${crestPx}px;background:hsl(${aHue},40%,14%);border-color:hsl(${aHue},40%,25%)"><span class="ini" style="color:hsl(${aHue},55%,60%);font-size:${Math.round(crestPx*0.28)}px">${aIni}</span></div>`;

  return `<div class="card">
    <div class="card-hdr">
      <span class="card-hdr-lbl">⚽ ${esc(m.label||`Match ${mi+1}`)}</span>
      <div style="display:flex;align-items:center;gap:0.4rem">
        ${matchBadgeHtml(m)}
        <span style="font-family:'Bebas Neue',cursive;font-size:clamp(0.55rem,1vw,0.85rem);color:${done?'var(--win)':'var(--muted)'}">${done?'✅ FT':'⏳'}</span>
      </div>
    </div>
    <div class="card-body">
      <div class="team" style="position:relative;overflow:hidden">
        ${hWin?`<canvas class="confetti-canvas" id="${confId}-h"></canvas><div class="trophy-ghost">🏆</div>`:''}
        ${hCrest}
        <div class="team-name hn" style="${hWin?'color:var(--win)':''}">${esc(hName)}</div>
        <div style="font-family:'Bebas Neue',cursive;font-size:clamp(0.5rem,0.9vw,0.78rem);letter-spacing:0.08em;${hPtsCls}">${hPts}</div>
      </div>
      <div class="score-col">${scoreHtml}</div>
      <div class="team" style="position:relative;overflow:hidden">
        ${aWin?`<canvas class="confetti-canvas" id="${confId}-a"></canvas><div class="trophy-ghost">🏆</div>`:''}
        ${aCrest}
        <div class="team-name an" style="${aWin?'color:var(--win)':''}">${esc(aName)}</div>
        <div style="font-family:'Bebas Neue',cursive;font-size:clamp(0.5rem,0.9vw,0.78rem);letter-spacing:0.08em;${aPtsCls}">${aPts}</div>
      </div>
    </div>
    <div class="result-bar ${resCls}">${resText}</div>
  </div>`;
}

function singleCardHtml(m, mi){
  const hIdx=m.home, aIdx=m.away;
  const hS=(m.hScore===''||m.hScore===null||m.hScore===undefined)?null:parseInt(m.hScore);
  const aS=(m.aScore===''||m.aScore===null||m.aScore===undefined)?null:parseInt(m.aScore);
  const done=hS!==null&&aS!==null&&hIdx!==null&&aIdx!==null;
  const hWin=done&&hS>aS, aWin=done&&aS>hS, draw=done&&hS===aS;
  const hName=hIdx!==null?pName(hIdx):'TBD';
  const aName=aIdx!==null?pName(aIdx):'TBD';
  const confId=`sconf-${mi}`;

  const hSrc=hIdx!==null?getImg(hIdx):null;
  const aSrc=aIdx!==null?getImg(aIdx):null;
  const hHue=((hName).split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
  const aHue=((aName).split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
  const hIni=(hName||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
  const aIni=(aName||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
  const hBg=hSrc?`style="background-image:url('${hSrc}')"`:'' ;
  const aBg=aSrc?`style="background-image:url('${aSrc}')"`:'' ;
  const hCrest=hSrc?`<div class="csteam-crest"><img src="${hSrc}" alt=""></div>`:
    `<div class="csteam-crest"><span class="csteam-crest-ini" style="color:hsl(${hHue},60%,62%)">${hIni}</span></div>`;
  const aCrest=aSrc?`<div class="csteam-crest"><img src="${aSrc}" alt=""></div>`:
    `<div class="csteam-crest"><span class="csteam-crest-ini" style="color:hsl(${aHue},60%,62%)">${aIni}</span></div>`;

  let scoreHtml;
  if(done){
    const hCol=hWin?'var(--win)':aWin?'var(--lose)':'var(--draw)';
    const aCol=aWin?'var(--win)':hWin?'var(--lose)':'var(--draw)';
    scoreHtml=`<div class="csscore-num"><span style="color:${hCol}">${hS}</span><span class="csscore-sep"> – </span><span style="color:${aCol}">${aS}</span></div>`;
  } else {
    scoreHtml=`<div class="csscore-vs">VS</div><div class="csscore-pending">– –</div>`;
  }

  let resText='Upcoming',resCls='csr-pending';
  if(done){
    if(hWin){resText=`🏆 ${esc(hName)} Wins 🏆`;resCls='csr-win';}
    else if(aWin){resText=`🏆 ${esc(aName)} Wins 🏆`;resCls='csr-win';}
    else{resText='Draw';resCls='csr-draw';}
  }

  const hConf=hWin?`<canvas class="confetti-canvas" id="${confId}-h"></canvas><div class="trophy-ghost">🏆</div>`:'';
  const aConf=aWin?`<canvas class="confetti-canvas" id="${confId}-a"></canvas><div class="trophy-ghost">🏆</div>`:'';

  return `<div class="card-single">
    <div class="card-single-hdr">
      <span class="card-single-hdr-lbl">${matchBadgeHtml(m)} ${esc(m.label||`Match ${mi+1}`)}</span>
      <span style="font-family:'Bebas Neue',cursive;font-size:clamp(0.7rem,1.3vw,1.1rem);color:${done?'var(--win)':'var(--muted)'};">${done?'✅ Full Time':'⏳ Upcoming'}</span>
    </div>
    <div class="card-single-body">
      <div class="csteam" style="position:relative;overflow:hidden">
        <div class="csteam-bg" ${hBg}></div>
        ${hWin?`<canvas class="confetti-canvas" id="${confId}-h"></canvas><div class="trophy-ghost">🏆</div>`:''}
        <div class="csteam-content">
          <div class="csteam-label">🏠 Home</div>
          ${hCrest}
          <div class="csteam-name cn-home" style="${hWin?'color:var(--win);text-shadow:0 0 28px rgba(34,197,94,0.45)':''}">${esc(hName)}</div>
          ${done?`<div class="csteam-pts ${hWin?'cp-w':draw?'cp-d':'cp-l'}">${hWin?'+ 3 PTS':draw?'+ 1 PT':'0 PTS'}</div>`:m.type==='group'?`<div class="csteam-pts cp-u">– PTS</div>`:''}
        </div>
      </div>
      <div class="csscore">${scoreHtml}</div>
      <div class="csteam" style="position:relative;overflow:hidden">
        <div class="csteam-bg" ${aBg}></div>
        ${aWin?`<canvas class="confetti-canvas" id="${confId}-a"></canvas><div class="trophy-ghost">🏆</div>`:''}
        <div class="csteam-content">
          <div class="csteam-label">✈️ Away</div>
          ${aCrest}
          <div class="csteam-name cn-away" style="${aWin?'color:var(--win);text-shadow:0 0 28px rgba(34,197,94,0.45)':''}">${esc(aName)}</div>
          ${done?`<div class="csteam-pts ${aWin?'cp-w':draw?'cp-d':'cp-l'}">${aWin?'+ 3 PTS':draw?'+ 1 PT':'0 PTS'}</div>`:m.type==='group'?`<div class="csteam-pts cp-u">– PTS</div>`:''}
        </div>
      </div>
    </div>
    <div class="card-single-result ${resCls}">${resText}</div>
  </div>`;
}

// RENDER

function render(){
  if(!lastData||!allRounds.length){showWaiting(true);return;}
  showWaiting(false);

  const round=allRounds[obsRound];
  if(!round){return;}

  // Update header
  document.getElementById('round-lbl').textContent=round.label;
  document.getElementById('btn-prev').disabled=obsRound<=0;
  document.getElementById('btn-next').disabled=obsRound>=allRounds.length-1;

  // Stage badge
  const sb=document.getElementById('stage-badge');
  if(round.type==='draw'){sb.textContent='Group Draw';sb.className='stage-badge sb-group';}
  else if(round.type==='group'){sb.textContent='Group Stage';sb.className='stage-badge sb-group';}
  else if(round.type==='group-tables'){sb.textContent='Group Tables';sb.className='stage-badge sb-group';}
  else if(round.type==='round-tables'){sb.textContent='Group Tables';sb.className='stage-badge sb-group';}
  else if(round.type==='qf'){sb.textContent='Quarter-Finals';sb.className='stage-badge sb-qf';}
  else if(round.type==='sf'){sb.textContent='Semi-Finals';sb.className='stage-badge sb-sf';}
  else if(round.type==='results'){sb.textContent='Final Results';sb.className='stage-badge sb-final';}
  else if(round.type==='goals'){sb.textContent='Total Goals';sb.className='stage-badge sb-final';}
  else{sb.textContent='Finals';sb.className='stage-badge sb-final';}

  stopAllConfetti();
  const grid=document.getElementById('grid');

  // ── DRAW SCREEN ──
  if(round.type==='draw'){
    grid.style.gridTemplateColumns='1fr';
    grid.style.gridTemplateRows='1fr';
    grid.innerHTML=`<div id="draw-screen" style="
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(4px,0.8vh,10px);padding:clamp(6px,1vh,12px);height:100%;width:100%;">
      <div style="font-family:'Bebas Neue',cursive;letter-spacing:0.12em;
        font-size:clamp(1.2rem,3vw,2.6rem);flex-shrink:0;
        background:var(--grad-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
        🎲 Group Draw</div>
      <div id="draw-subtitle" style="font-family:'Bebas Neue',cursive;
        font-size:clamp(0.6rem,1.1vw,0.9rem);color:var(--muted);letter-spacing:0.12em;flex-shrink:0">
        Ready — press Start when you want to reveal the groups</div>
      <div id="draw-groups" style="
        display:grid;grid-template-columns:repeat(4,1fr);
        gap:clamp(4px,0.8vw,12px);width:100%;flex:1;min-height:0;overflow:hidden;"></div>
      <button id="draw-start-btn" onclick="handleDrawBtn()" style="
        flex-shrink:0;background:var(--grad-gold);border:none;color:#000;
        border-radius:8px;padding:clamp(5px,0.8vh,10px) clamp(16px,3vw,36px);
        font-family:'Bebas Neue',cursive;font-size:clamp(0.9rem,1.8vw,1.6rem);
        letter-spacing:0.1em;cursor:pointer;transition:opacity 0.15s;font-weight:700;">
        🎲 Start Draw
      </button>
    </div>`;
    // Build empty grid slots ready to go
    buildDrawGrid();
    // Always show ready/completed state — only animate when explicitly triggered
    if(drawPlayed) { renderDrawFinal(); }
    // else leave slots in pending state with Start Draw button
    renderStrip();
    return;
  }

  // ── GROUP TABLES SCREEN ──
  if(round.type==='group-tables'){
    grid.style.gridTemplateColumns='1fr';
    grid.style.gridTemplateRows='1fr';
    grid.innerHTML=`<div style="padding:clamp(6px,1vh,14px);height:100%;overflow:hidden;display:flex;flex-direction:column;gap:clamp(4px,0.7vh,10px)">
      <div style="font-family:'Bebas Neue',cursive;font-size:clamp(1rem,2.2vw,1.9rem);letter-spacing:0.1em;background:var(--grad-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0">📊 Group Tables</div>
      <div id="obs-group-tables" style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,0.9vw,14px)"></div>
    </div>`;
    renderObsGroupTables();
    renderStrip();
    return;
  }

  // ── PER-ROUND TABLES SCREEN (after each matchday) ──
  if(round.type==='round-tables'){
    grid.style.gridTemplateColumns='1fr';
    grid.style.gridTemplateRows='1fr';
    grid.innerHTML=`<div style="padding:clamp(6px,1vh,14px);height:100%;overflow:hidden;display:flex;flex-direction:column;gap:clamp(4px,0.7vh,10px)">
      <div style="font-family:'Bebas Neue',cursive;font-size:clamp(1rem,2.2vw,1.9rem);letter-spacing:0.1em;background:var(--grad-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0">📊 Tables — After Round ${(round.upToRound??0)+1}</div>
      <div id="obs-group-tables" style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,0.9vw,14px)"></div>
    </div>`;
    renderObsGroupTables(round.upToRound);
    renderStrip();
    return;
  }

  // ── RESULTS SCREEN ──
  if(round.type==='results'){
    grid.style.gridTemplateColumns='1fr';
    grid.style.gridTemplateRows='1fr';
    grid.innerHTML=renderResultsScreen();
    // Confetti on the champion
    setTimeout(()=>{
      const cc=document.getElementById('results-champ-confetti');
      if(cc) launchConfetti('results-champ-confetti');
    },200);
    renderStrip();
    return;
  }

  // ── GOALS LEADERBOARD SCREEN ──
  if(round.type==='goals'){
    grid.style.gridTemplateColumns='1fr';
    grid.style.gridTemplateRows='1fr';
    grid.innerHTML=`<div style="padding:clamp(6px,1vh,14px);height:100%;overflow:hidden;display:flex;flex-direction:column;gap:clamp(4px,0.7vh,10px)">
      <div style="font-family:'Bebas Neue',cursive;font-size:clamp(1rem,2.2vw,1.9rem);letter-spacing:0.1em;background:var(--grad-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0">⚽ Total Goals Leaderboard</div>
      <div id="obs-goals-lb" style="flex:1;min-height:0;overflow:hidden"></div>
    </div>`;
    renderObsGoalsLeaderboard();
    renderStrip();
    return;
  }

  const matches = round.type==='group'
    ? round.matches  // always show all group matches, scores may be empty
    : round.matches.filter(m=>m.home!==null||m.away!==null);

  if(!matches.length){grid.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-family:Bebas Neue,cursive;font-size:clamp(1rem,2vw,1.5rem);letter-spacing:0.1em">No matches available yet</div>';renderStrip();return;}

  const n=matches.length;

  if(cycleActive){
    // Single fullscreen card
    const mi=cycleMatchIdx%n;
    const m=matches[mi];
    grid.style.gridTemplateColumns='1fr';
    grid.style.gridTemplateRows='1fr';
    grid.innerHTML=singleCardHtml(m,mi);
    const hS=m.hScore===''||m.hScore===null?null:parseInt(m.hScore);
    const aS=m.aScore===''||m.aScore===null?null:parseInt(m.aScore);
    if(hS!==null&&aS!==null){
      if(hS>aS) setTimeout(()=>launchConfetti(`sconf-${mi}-h`),80);
      else if(aS>hS) setTimeout(()=>launchConfetti(`sconf-${mi}-a`),80);
    }
    updateCycleInd();
  } else {
    const isKO = round.type==='qf'||round.type==='sf'||round.type==='final';
    let cols, rows;
    if(round.type==='qf'){
      // 4 QF matches — 2x2 grid
      cols = n<=1?1:2;
      rows = Math.ceil(n/cols);
    } else if(isKO){
      // SF/Final — 2 matches stacked vertically
      cols = 1;
      rows = n;
    } else {
      cols = (n<=2?n:n<=4?2:n<=6?3:4);
      rows = Math.ceil(n/cols);
    }
    grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    grid.style.gridTemplateRows=`repeat(${rows},1fr)`;
    const crestPx = isKO
      ? Math.min(Math.round(window.innerHeight*(round.type==='qf'?0.16:0.28)), round.type==='qf'?160:240)
      : Math.min(Math.round(window.innerWidth/(cols*4)),60);
    grid.innerHTML=matches.map((m,i)=>compactCardHtml(m,i,crestPx,isKO)).join('');
    matches.forEach((m,i)=>{
      const hS=m.hScore===''||m.hScore===null?null:parseInt(m.hScore);
      const aS=m.aScore===''||m.aScore===null?null:parseInt(m.aScore);
      if(hS!==null&&aS!==null){
        if(hS>aS) setTimeout(()=>launchConfetti(`conf-${i}-h`),80);
        else if(aS>hS) setTimeout(()=>launchConfetti(`conf-${i}-a`),80);
      }
    });
  }

  renderStrip();
}

function renderStrip(){
  if(!lastData) return;
  const cont=document.getElementById('strip-groups');
  let html='';
  const groupColors=[['gb-a','var(--ga)'],['gb-b','var(--gb)'],['gb-c','var(--gc)'],['gb-d','var(--gd)']];
  const groupLabels=['A','B','C','D'];
  for(let g=0;g<4;g++){
    const st=calcGroupStandings(g,lastData);
    if(!st.length) continue;
    const [cls,col]=groupColors[g];
    html+=`<div class="strip-group">
      <span class="strip-group-lbl ${cls}">Grp ${groupLabels[g]}</span>`;
    st.slice(0,4).forEach((s,pos)=>{
      const rankCls=pos===0?'sr1':pos===1?'sr2':'sr3';
      const isWinner=pos===0;
      html+=`<div class="strip-item ${isWinner?'strip-winner':''}">
        <span class="strip-rank ${rankCls}">${pos+1}</span>
        ${miniCrest(s.idx)}
        <span>${esc(pName(s.idx))}</span>
        <span class="strip-pts">${s.pts}</span>
      </div>`;
      if(pos<st.length-1&&pos<3) html+=`<span class="strip-sep">·</span>`;
    });
    html+=`</div>`;
    if(g<3) html+=`<span style="color:var(--border);font-size:1rem">|</span>`;
  }
  cont.innerHTML=html||'—';
}

function obsRoundIdxForKey(key, rounds){
  if(!rounds) return -1;
  // key formats: 'draw', 'group-0', 'group-1'..., 'group-tables', 'qf', 'final', 'results'
  for(let i=0;i<rounds.length;i++){
    const r=rounds[i];
    if(key==='draw'         && r.type==='draw')         return i;
    if(key==='group-tables' && r.type==='group-tables') return i;
    if(key==='qf'           && r.type==='qf')           return i;
    if(key==='sf'           && r.type==='sf')           return i;
    if(key==='final'        && r.type==='final')        return i;
    if(key==='results'      && r.type==='results')      return i;
    if(key==='goals'        && r.type==='goals')        return i;
    if(key.startsWith('group-')){
      const rNum=parseInt(key.split('-')[1]);
      if(r.type==='group'&&r.matches.length&&r.matches[0].roundIdx===rNum) return i;
    }
    if(key.startsWith('round-tables-')){
      const rNum=parseInt(key.split('-')[2]);
      if(r.type==='round-tables'&&r.upToRound===rNum) return i;
    }
  }
  return -1;
}

function navRound(dir){
  obsRound=Math.max(0,Math.min(allRounds.length-1,obsRound+dir));
  cycleMatchIdx=0;
  // Write back so manager tab indicator stays in sync
  const r=allRounds[obsRound];
  if(r){
    let key=r.type;
    if(r.type==='group'&&r.matches&&r.matches.length) key=`group-${r.matches[0].roundIdx}`;
    if(r.type==='round-tables') key=`round-tables-${r.upToRound}`;
    try{localStorage.setItem('wc_obs_screen',key);}catch(e){}
  }
  render();
}

function advanceCycle(){
  if(!lastData||!allRounds.length) return;
  const round=allRounds[obsRound];
  if(!round) return;
  const matches=round.matches.filter(m=>m.home!==null||m.away!==null);
  const n=matches.length||1;
  cycleMatchIdx=(cycleMatchIdx+1)%n;
  render();
}

function startCycle(){
  cycleActive=true;cycleMatchIdx=0;
  document.getElementById('play-btn').textContent='⏹ Stop';
  document.getElementById('cycle-ind').style.display='';
  updateCycleInd();render();
  cycleTimer=setInterval(advanceCycle,cycleDelay);
}
function stopCycle(){
  cycleActive=false;clearInterval(cycleTimer);cycleTimer=null;
  document.getElementById('play-btn').textContent='▶ Cycle';
  document.getElementById('cycle-ind').style.display='none';
  render();
}
function toggleCycle(){if(cycleActive)stopCycle();else startCycle();}
function updateCycleInd(){
  if(!lastData||!allRounds.length) return;
  const round=allRounds[obsRound];
  const n=(round&&round.matches.filter(m=>m.home!==null||m.away!==null).length)||0;
  document.getElementById('cycle-ind').textContent=`Match ${cycleMatchIdx+1}/${n}`;
}

// LOAD from localStorage
// ══════════════════════════════════════
function load(){
  try{
    const raw=localStorage.getItem('wc_state');
    const rawImgs=localStorage.getItem('wc_imgs');

    if(!raw){
      showWaiting(true);
      document.getElementById('debug-box').textContent=
        'No World Cup data found. Open worldcup.html in this same browser and generate a tournament.';
      document.getElementById('status-txt').textContent='No data';
      return;
    }

    const s=JSON.parse(raw);
    if(!s.tournamentGenerated){
      showWaiting(true);
      document.getElementById('debug-box').textContent=
        'Tournament not generated yet. Go to worldcup.html and click "Generate Tournament".';
      document.getElementById('status-txt').textContent='Not started';
      return;
    }

    // Merge images
    let imgs={};
    if(rawImgs){ try{imgs=JSON.parse(rawImgs);}catch(e){} }

    const data={
      numPlayers:   s.numPlayers||16,
      players:      s.players||[],
      groups:       s.groups||[[],[],[],[]],
      groupSchedule:s.groupSchedule||[],
      groupScores:  s.groupScores||{},
      knockout:     s.knockout||{qf:[{home:null,away:null},{home:null,away:null},{home:null,away:null},{home:null,away:null}],sf:[{home:null,away:null},{home:null,away:null}],final:{home:null,away:null},third:{home:null,away:null}},
      knockoutScores:s.knockoutScores||{},
      playerRoundScores:s.playerRoundScores||{},
      tiebreakers:  s.tiebreakers||{},
      playerImages: imgs,
    };

    const newRounds=buildAllRounds(data);
    const changed=JSON.stringify(newRounds)!==JSON.stringify(allRounds)||
      JSON.stringify(data.groupScores)!==JSON.stringify(lastData&&lastData.groupScores)||
      JSON.stringify(data.knockoutScores)!==JSON.stringify(lastData&&lastData.knockoutScores)||
      JSON.stringify(data.knockout)!==JSON.stringify(lastData&&lastData.knockout)||
      JSON.stringify(data.tiebreakers)!==JSON.stringify(lastData&&lastData.tiebreakers)||
      JSON.stringify(data.playerRoundScores)!==JSON.stringify(lastData&&lastData.playerRoundScores)||
      lastData===null;

    lastData=data;
    allRounds=newRounds;

    // Sync to whatever screen the manager has selected
    const obsScreenKey = localStorage.getItem('wc_obs_screen');
    let screenChanged = false;
    if(obsScreenKey){
      const targetIdx = obsRoundIdxForKey(obsScreenKey, newRounds);
      if(targetIdx !== -1 && targetIdx !== obsRound){
        obsRound = targetIdx;
        screenChanged = true;
      }
    } else if(!userNavigated){
      obsRound = 0;
    }

    // Check for draw trigger from manager
    const drawTrigger = localStorage.getItem('wc_obs_draw_trigger');
    if(drawTrigger && drawTrigger !== lastDrawTrigger){
      lastDrawTrigger = drawTrigger;
      drawPlayed = false;
      obsRound = obsRoundIdxForKey('draw', newRounds);
      if(obsRound < 0) obsRound = 0;
      screenChanged = true;
      // Run draw animation after render builds the screen
      setTimeout(()=>{ drawPlayed=true; runDrawAnimation(); }, 400);
    }

    showWaiting(false);
    // Always re-render if screen changed OR data changed
    if(changed || screenChanged) render();

    document.getElementById('status-txt').textContent='Live · '+new Date().toLocaleTimeString();
    document.getElementById('status-bar-txt').textContent=
      `${data.players.filter(Boolean).length} teams · ${allRounds.length} rounds · updated ${new Date().toLocaleTimeString()}`;

  }catch(e){
    showWaiting(true);
    document.getElementById('debug-box').textContent='Error: '+e.message;
    document.getElementById('status-txt').textContent='Error';
    console.error('OBS load error',e);
  }
}

  drawPlayed=true;

function renderDrawFinal(){
  // Show completed draw with all teams revealed, no animation
  buildDrawGrid();
  const {numPlayers}=lastData;
  const perGroup=numPlayers/4;
  const sub=document.getElementById('draw-subtitle');
  if(sub) sub.textContent='✅ Groups Confirmed — press ▶ to continue';
  for(let g=0;g<4;g++) for(let s=0;s<perGroup;s++) revealSlotFinal(g,s);
  const btn=document.getElementById('draw-start-btn');
  if(btn){btn.textContent='⟳ Re-run Draw';btn.disabled=false;btn.style.opacity='1';}
}

function runDrawAnimation(){
  if(!lastData) return;
  drawTimers.forEach(clearTimeout); drawTimers=[];
  buildDrawGrid();

  const {players,groups,numPlayers,playerImages}=lastData;
  const perGroup=numPlayers/4;
  const allNames=players.filter(Boolean);
  const spinIntervals={};

  function spinSlot(g,s){
    const nameEl=document.getElementById(`ds-name-${g}-${s}`);
    const slot=document.getElementById(`ds-${g}-${s}`);
    if(slot) slot.className='draw-slot spinning';
    spinIntervals[`${g}-${s}`]=setInterval(()=>{
      const rnd=allNames[Math.floor(Math.random()*allNames.length)]||'???';
      if(nameEl) nameEl.textContent=rnd;
    },80);
  }

  function revealSlot(g,s){
    clearInterval(spinIntervals[`${g}-${s}`]);
    revealSlotFinal(g,s);
  }

  // Interleave reveal order: slot 0 of all groups, then slot 1, etc.
  const revealOrder=[];
  for(let s=0;s<perGroup;s++) for(let g=0;g<4;g++) revealOrder.push({g,s});

  const spinDelay=600, spinDuration=1800, revealGap=200;
  let t=600;
  const sub=document.getElementById('draw-subtitle');
  if(sub) sub.textContent='Drawing the groups…';

  revealOrder.forEach(({g,s},i)=>{
    drawTimers.push(setTimeout(()=>spinSlot(g,s), t));
    drawTimers.push(setTimeout(()=>{
      revealSlot(g,s);
      const remaining=revealOrder.length-i-1;
      const el=document.getElementById('draw-subtitle');
      if(el) el.textContent=remaining===0?'✅ Groups Confirmed — press ▶ to continue':
        `Drawing… ${i+1} of ${revealOrder.length}`;
      if(remaining===0){
        const btn=document.getElementById('draw-start-btn');
        if(btn){btn.disabled=false;btn.style.opacity='1';}
      }
    }, t+spinDuration));
    t+=spinDelay+revealGap;
  });
}

function getPlayerTotalGoals(idx){
  const prs = lastData.playerRoundScores||{};
  let goals=0;
  Object.values(prs).forEach(rnd=>{
    // keys may be stored as string or int after JSON roundtrip
    const v = rnd[idx] !== undefined ? rnd[idx] : rnd[String(idx)];
    if(v!==undefined && v!=='' && v!==null) goals += parseInt(v)||0;
  });
  return goals;
}

function renderResultsScreen(){
  if(!lastData) return '<div style="color:var(--muted);text-align:center;padding:2rem;font-family:Bebas Neue,cursive;font-size:1.5rem">No data</div>';

  const {knockout, knockoutScores, numPlayers, groups} = lastData;
  const ks = knockoutScores||{};
  const ko = knockout||{};
  const tb = lastData.tiebreakers||{};

  function obsKOMatch(key){
    if(key==='qf0') return (ko.qf&&ko.qf[0])||{home:null,away:null};
    if(key==='qf1') return (ko.qf&&ko.qf[1])||{home:null,away:null};
    if(key==='qf2') return (ko.qf&&ko.qf[2])||{home:null,away:null};
    if(key==='qf3') return (ko.qf&&ko.qf[3])||{home:null,away:null};
    if(key==='sf0') return (ko.sf&&ko.sf[0])||{home:null,away:null};
    if(key==='sf1') return (ko.sf&&ko.sf[1])||{home:null,away:null};
    if(key==='final') return ko.final||{home:null,away:null};
    if(key==='third') return ko.third||{home:null,away:null};
    return {home:null,away:null};
  }

  function koWinner(key){
    const s=ks[key]||{};
    const m=obsKOMatch(key);
    if(s.home===''||s.home===undefined||s.home===null||s.away===''||s.away===undefined||s.away===null) return null;
    const h=parseInt(s.home),a=parseInt(s.away);
    if(isNaN(h)||isNaN(a)) return null;
    if(h>a) return m.home;
    if(a>h) return m.away;
    // Draw — check tiebreaker
    if(tb[key]!==undefined) return tb[key];
    return null;
  }
  function koLoser(key){
    const s=ks[key]||{};
    const m=obsKOMatch(key);
    if(s.home===''||s.home===undefined||s.home===null||s.away===''||s.away===undefined||s.away===null) return null;
    const h=parseInt(s.home),a=parseInt(s.away);
    if(isNaN(h)||isNaN(a)) return null;
    if(h>a) return m.away;
    if(a>h) return m.home;
    // Draw — check tiebreaker, loser is the other team
    if(tb[key]!==undefined) return tb[key]===m.home ? m.away : m.home;
    return null;
  }

  const p1=koWinner('final'), p2=koLoser('final');
  const p3=koWinner('third'), p4=koLoser('third');

  function podiumCard(pos, idx, label, posClass, icon, medalColour){
    const name = idx!==null ? pName(idx) : '—';
    const src  = idx!==null ? getImg(idx) : null;
    const hue  = idx!==null ? (name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360 : 0;
    const ini  = (name||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
    const confId = pos===1 ? 'results-champ-confetti' : null;
    const goals = idx!==null ? getPlayerTotalGoals(idx) : 0;

    const crestEl = src
      ? `<div class="podium-crest-lg"><img src="${src}" alt=""></div>`
      : `<div class="podium-crest-lg" style="background:hsl(${hue},40%,14%);border:1px solid hsl(${hue},40%,25%)">
           <span style="font-family:'Bebas Neue',cursive;font-size:clamp(0.7rem,1.4vw,1.2rem);color:hsl(${hue},60%,60%)">${ini}</span>
         </div>`;
    const bgStyle = src ? `style="background-image:url('${src}')"` : '';

    return `<div class="podium-card" style="border-color:${medalColour}33">
      <div class="podium-card-bg" ${bgStyle}></div>
      ${confId ? `<canvas class="confetti-canvas" id="${confId}" style="z-index:4"></canvas>` : ''}
      <div class="podium-card-inner">
        <div class="podium-pos-badge ${posClass}">${icon}</div>
        ${crestEl}
        <div class="podium-info">
          <div class="podium-label">${label}</div>
          <div class="podium-name-lg" style="color:${idx!==null?'var(--text)':'var(--muted)'}">${esc(name)}</div>
        </div>
        ${idx!==null ? `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.1em;flex-shrink:0;margin-left:auto;padding-left:0.5em">
          <div style="font-family:'Bebas Neue',cursive;font-size:clamp(0.75rem,1.5vw,1.4rem);color:var(--win);white-space:nowrap">${goals} ⚽</div>
        </div>` : ''}
      </div>
    </div>`;
  }

  const podiumHtml = `<div class="results-podium">
    <div class="results-title">🏆 Tournament Results</div>
    ${podiumCard(1,p1,'World Champion','pp-1','🥇','#f6c90e')}
    ${podiumCard(2,p2,'Runner-Up',    'pp-2','🥈','#cbd5e1')}
    ${podiumCard(3,p3,'3rd Place',    'pp-3','🥉','#d97706')}
    ${podiumCard(4,p4,'4th Place',    'pp-4','4', '#5a8a5e')}
  </div>`;

  // ── Quarter-Final losers (eliminated before the Semi-Finals) ──
  function sfOutCard(idx){
    const name = idx!==null ? pName(idx) : '—';
    const src  = idx!==null ? getImg(idx) : null;
    const hue  = idx!==null ? (name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360 : 0;
    const ini  = (name||'?').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
    const goals = idx!==null ? getPlayerTotalGoals(idx) : 0;

    const crestEl = src
      ? `<div class="podium-crest-lg"><img src="${src}" alt=""></div>`
      : `<div class="podium-crest-lg" style="background:hsl(${hue},40%,14%);border:1px solid hsl(${hue},40%,25%)">
           <span style="font-family:'Bebas Neue',cursive;font-size:clamp(0.7rem,1.4vw,1.2rem);color:hsl(${hue},60%,60%)">${ini}</span>
         </div>`;
    const bgStyle = src ? `style="background-image:url('${src}')"` : '';

    return `<div class="sf-out-card">
      <div class="sf-out-card-bg" ${bgStyle}></div>
      <div class="sf-out-card-inner">
        <div class="sf-out-pos-badge">⚔️</div>
        ${crestEl}
        <div class="podium-info">
          <div class="podium-label">Quarter-Final</div>
          <div class="podium-name-lg" style="color:${idx!==null?'var(--text)':'var(--muted)'}">${esc(name)}</div>
        </div>
        ${idx!==null ? `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.1em;flex-shrink:0;margin-left:auto;padding-left:0.5em">
          <div style="font-family:'Bebas Neue',cursive;font-size:clamp(0.75rem,1.5vw,1.4rem);color:var(--win);white-space:nowrap">${goals} ⚽</div>
        </div>` : ''}
      </div>
    </div>`;
  }

  // The 4 teams eliminated in the Quarter-Finals, sorted by total goals desc
  const qfLosers = ['qf0','qf1','qf2','qf3']
    .map(k=>koLoser(k))
    .filter(idx=>idx!==null)
    .map(idx=>({idx, goals:getPlayerTotalGoals(idx)}))
    .sort((a,b)=>b.goals-a.goals)
    .map(e=>e.idx);

  const sfOutHtml = `<div class="sf-out-wrap">
    <div class="sf-out-title">⚔️ Out at the QF</div>
    ${qfLosers.map(idx=>sfOutCard(idx)).join('')}
  </div>`;

  // Build knocked-out list — anyone who finished 3rd or lower in their group
  // (1st and 2nd place in each group advance to the Quarter-Finals)
  const potList=[];
  for(let g=0;g<4;g++){
    const st=calcGroupStandings(g,lastData);
    st.slice(2).forEach(s=>{
      const goals=getPlayerTotalGoals(s.idx);
      potList.push({idx:s.idx,goals});
    });
  }
  potList.sort((a,b)=>b.goals-a.goals);

  const cols2 = potList.length > 16 ? 3 : potList.length > 8 ? 2 : 1;
  const tableStyle = cols2 > 1
    ? `display:grid;grid-template-columns:repeat(${cols2},1fr);gap:clamp(3px,0.4vw,6px);`
    : 'display:flex;flex-direction:column;gap:clamp(2px,0.35vh,5px);';

  let koRows='';
  potList.forEach((entry,pos)=>{
    const name=pName(entry.idx);
    const src=getImg(entry.idx);
    const hue=(name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
    const ini=name.split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
    const rankCol=pos===0?'var(--gold)':pos===1?'#cbd5e1':pos===2?'#d97706':'var(--muted)';
    const miniCrest=src
      ? `<div style="width:clamp(14px,1.8vw,22px);height:clamp(14px,1.8vw,22px);border-radius:3px;overflow:hidden;flex-shrink:0"><img src="${src}" style="width:100%;height:100%;object-fit:cover"></div>`
      : `<div style="width:clamp(14px,1.8vw,22px);height:clamp(14px,1.8vw,22px);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:hsl(${hue},40%,14%);font-family:'Bebas Neue',cursive;font-size:0.5rem;color:hsl(${hue},60%,60%)">${ini}</div>`;
    // Only show goals if > 0
    const goalsHtml = entry.goals > 0
      ? `<span class="ko-lb-goals">${entry.goals} ⚽</span>`
      : '';
    koRows+=`<div class="ko-lb-row">
      <span class="ko-lb-rank" style="color:${rankCol}">${pos+1}</span>
      ${miniCrest}
      <span class="ko-lb-name">${esc(name)}</span>
      ${goalsHtml}
    </div>`;
  });

  if(!koRows) koRows=`<div style="color:var(--muted);font-family:'Bebas Neue',cursive;font-size:clamp(0.8rem,1.5vw,1.2rem);padding:0.5rem">No eliminated teams yet</div>`;

  const koHtml=`<div class="ko-lb-wrap">
    <div class="ko-lb-title">⚰️ Knocked Out — Best Scorers</div>
    <div class="ko-lb-table" style="${tableStyle}">${koRows}</div>
  </div>`;

  return `<div class="results-wrap">${podiumHtml}${sfOutHtml}${koHtml}</div>`;
}

// ══════════════════════════════════════
// OBS GOALS LEADERBOARD
// ══════════════════════════════════════
function renderObsGoalsLeaderboard(){
  const cont = document.getElementById('obs-goals-lb');
  if(!cont || !lastData) return;
  const {players, groups, numPlayers} = lastData;

  // Build full list — all players sorted by total goals
  const all = players.map((name, idx) => ({
    idx,
    name: name || `Team ${idx+1}`,
    goals: getPlayerTotalGoals(idx),
    group: Math.floor(idx / (numPlayers/4))
  })).sort((a,b) => b.goals !== a.goals ? b.goals - a.goals : a.name.localeCompare(b.name));

  // Two or three columns depending on player count
  const cols = all.length > 20 ? 3 : all.length > 12 ? 2 : 1;
  const gridStyle = cols > 1
    ? `display:grid;grid-template-columns:repeat(${cols},1fr);gap:clamp(3px,0.5vw,8px);`
    : 'display:flex;flex-direction:column;gap:clamp(2px,0.35vh,5px);';

  const groupColors = ['var(--ga)','var(--gb)','var(--gc)','var(--gd)'];
  const groupLabels = ['A','B','C','D'];

  let rows = '';
  all.forEach((p, pos) => {
    const src = getImg(p.idx);
    const hue = (p.name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360;
    const ini = p.name.split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3)||'?';
    const rankCol = pos===0?'var(--gold)':pos===1?'#cbd5e1':pos===2?'#d97706':'var(--muted)';
    const isTop3 = pos < 3;
    const miniCrest = src
      ? `<div style="width:clamp(14px,2vw,26px);height:clamp(14px,2vw,26px);border-radius:3px;overflow:hidden;flex-shrink:0"><img src="${src}" style="width:100%;height:100%;object-fit:cover"></div>`
      : `<div style="width:clamp(14px,2vw,26px);height:clamp(14px,2vw,26px);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:hsl(${hue},40%,14%);font-family:'Bebas Neue',cursive;font-size:0.5rem;color:hsl(${hue},60%,60%)">${ini}</div>`;
    const grpCol = groupColors[p.group]||'var(--muted)';
    const grpLbl = groupLabels[p.group]||'?';
    rows += `<div style="
      display:flex;align-items:center;gap:clamp(4px,0.6vw,9px);
      background:${isTop3?'rgba(246,201,14,0.05)':'rgba(6,22,7,0.85)'};
      border:1px solid ${isTop3?'rgba(246,201,14,0.18)':'rgba(255,255,255,0.07)'};
      border-radius:clamp(4px,0.6vw,8px);
      padding:clamp(3px,0.5vh,7px) clamp(6px,0.9vw,12px);flex-shrink:0;">
      <span style="font-family:'Bebas Neue',cursive;font-size:clamp(0.75rem,1.4vw,1.3rem);color:${rankCol};min-width:1.4em;text-align:center;flex-shrink:0">${pos+1}</span>
      ${miniCrest}
      <span style="flex:1;font-family:'Bebas Neue',cursive;font-size:clamp(0.65rem,1.3vw,1.2rem);letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
      <span style="font-size:clamp(0.42rem,0.75vw,0.65rem);font-weight:700;color:${grpCol};background:${grpCol}18;padding:0.08em 0.35em;border-radius:3px;flex-shrink:0">Grp ${grpLbl}</span>
      <span style="font-family:'Bebas Neue',cursive;font-size:clamp(0.9rem,1.8vw,1.7rem);color:var(--win);flex-shrink:0;min-width:2.5em;text-align:right">${p.goals} ⚽</span>
    </div>`;
  });

  if(!rows) rows = `<div style="color:var(--muted);font-family:'Bebas Neue',cursive;padding:1rem">No scores entered yet</div>`;
  cont.innerHTML = `<div style="${gridStyle}">${rows}</div>`;
}

// ══════════════════════════════════════
// IMAGE PACK EXPORT
// ══════════════════════════════════════
async function downloadImagePack(){
  if(!lastData){ alert('No tournament data loaded yet.'); return; }

  const btn = document.getElementById('dl-btn');
  const overlay = document.getElementById('export-overlay');
  const progBar = document.getElementById('export-prog-bar');
  const progLabel = document.getElementById('export-prog-label');

  // Build list of screens to capture
  const screens = [];
  let sNum = 1;
  for(const r of allRounds){
    const n = ()=>String(sNum).padStart(2,'0');
    if(r.type==='draw'){
      const ri=allRounds.indexOf(r);
      screens.push({key:'draw', label:`${n()} - Group Draw`, setup:async()=>{
        obsRound=ri; render();
        await new Promise(res=>setTimeout(res,150));
        renderDrawFinal();
      }});
    } else if(r.type==='group'){
      const md = r.matches[0]?.roundIdx ?? 0;
      screens.push({key:`group-${md}`, label:`${n()} - Matchday ${md+1}`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='round-tables'){
      screens.push({key:`round-tables-${r.upToRound}`, label:`${n()} - Tables after Round ${(r.upToRound??0)+1}`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='group-tables'){
      screens.push({key:'group-tables', label:`${n()} - Group Tables`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='qf'){
      screens.push({key:'qf', label:`${n()} - Quarter Finals`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='sf'){
      screens.push({key:'sf', label:`${n()} - Semi Finals`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='final'){
      screens.push({key:'final', label:`${n()} - Final and 3rd Place`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='results'){
      screens.push({key:'results', label:`${n()} - Results`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    } else if(r.type==='goals'){
      screens.push({key:'goals', label:`${n()} - Total Goals`, setup:(()=>{const ri=allRounds.indexOf(r);return()=>{obsRound=ri;render();};})()} );
    }
    sNum++;
  }

  // Show overlay, disable button
  overlay.style.display='flex';
  btn.disabled=true; btn.style.opacity='0.4';
  stopCycle();

  const zip = new JSZip();
  const captureEl = document.querySelector('.wrap');
  const savedRound = obsRound;

  for(let i=0;i<screens.length;i++){
    const sc = screens[i];
    progLabel.textContent = `Capturing: ${sc.label}`;
    progBar.style.width = `${Math.round((i/screens.length)*100)}%`;

    // Set up the screen
    await sc.setup();
    // Allow DOM to paint
    await new Promise(r=>setTimeout(r,320));

    try{
      const canvas = await html2canvas(captureEl, {
        scale: 1.5,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#0d3410',
        logging: false,
        ignoreElements: el => el.id==='export-overlay'
      });
      const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
      zip.file(`${sc.label}.png`, blob);
    }catch(e){
      console.warn('Capture failed for', sc.label, e);
    }
  }

  progLabel.textContent = 'Building zip…';
  progBar.style.width = '95%';

  // Restore original screen
  obsRound = savedRound;
  render();

  const zipBlob = await zip.generateAsync({type:'blob'}, meta=>{
    progBar.style.width = `${95 + meta.percent*0.05}%`;
  });

  // Download
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url; a.download = 'WorldCup_OBS_Screens.zip';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);

  // Clean up
  progBar.style.width='100%';
  progLabel.textContent='✅ Done!';
  await new Promise(r=>setTimeout(r,800));
  overlay.style.display='none';
  btn.disabled=false; btn.style.opacity='1';
}

load();
setInterval(load,2000);

</script>
